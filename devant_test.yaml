openapi: 3.0.3
info:
  title: Test API for Devant
  description: A simple HTTP API to test integration in WSO2 Devant
  version: "1.0.0"
servers:
  - url: http://localhost:8000
paths:
  /hello:
    get:
      summary: Returns a simple hello message
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello from my test API!
  /greet/{name}:
    get:
      summary: Greets a user by name
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the user
          schema:
            type: string
            example: John
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello, John! Welcome to Devant testing.
